name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build
      run: |
        xcodebuild clean build \
          -scheme "Campus Ilmenau" \
          -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme "Campus Ilmenau" \
          -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO || true

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check for Development Team IDs
      run: |
        echo "Checking for DEVELOPMENT_TEAM..."
        if grep -r "DEVELOPMENT_TEAM" --include="*.pbxproj" --include="*.xcconfig" .; then
          echo "⚠️ WARNING: Found DEVELOPMENT_TEAM in project files!"
          echo "Consider removing specific Team IDs for open source projects."
          exit 1
        else
          echo "✅ No DEVELOPMENT_TEAM found"
        fi

    - name: Check for Provisioning Profiles
      run: |
        echo "Checking for provisioning profiles..."
        if find . -name "*.mobileprovision" -o -name "*.provisionprofile"; then
          echo "❌ ERROR: Found provisioning profiles in repository!"
          exit 1
        else
          echo "✅ No provisioning profiles found"
        fi

    - name: Check for Code Signing Certificates
      run: |
        echo "Checking for certificates..."
        if find . -name "*.p12" -o -name "*.cer" -o -name "*.certSigningRequest"; then
          echo "❌ ERROR: Found certificates in repository!"
          exit 1
        else
          echo "✅ No certificates found"
        fi

    - name: Check for App Store Connect API Keys
      run: |
        echo "Checking for App Store Connect API keys..."
        if find . -name "*.p8" -o -name "AuthKey_*.p8"; then
          echo "❌ ERROR: Found App Store Connect API keys!"
          exit 1
        else
          echo "✅ No API keys found"
        fi

    - name: Check for Firebase Config
      run: |
        echo "Checking for Firebase config..."
        if find . -name "GoogleService-Info.plist" -o -name "google-services.json"; then
          echo "⚠️ WARNING: Found Firebase configuration files!"
          echo "Make sure they don't contain sensitive data."
        else
          echo "✅ No Firebase config found"
        fi

    - name: Check for API Keys in code
      run: |
        echo "Checking for potential API keys in code..."
        if grep -r -i "api.key\|apikey\|api_key" --include="*.swift" --include="*.plist" . | grep -v "// Example"; then
          echo "⚠️ WARNING: Found potential API keys in code!"
          echo "Please review and ensure no real keys are committed."
        else
          echo "✅ No obvious API keys found in code"
        fi

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging || true
