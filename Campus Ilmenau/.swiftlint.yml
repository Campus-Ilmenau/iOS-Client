# SwiftLint Konfiguration für Campus Ilmenau

# Ausgeschlossene Pfade
excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData

# Aktivierte Regeln
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - fallthrough
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# Deaktivierte Regeln
disabled_rules:
  - trailing_whitespace
  - todo

# Konfigurierbare Regeln
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - url
    - x
    - y
    - z

# Custom Reporter
reporter: "xcode"
